version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lana_vpn_db
    environment:
      POSTGRES_DB: lana_vpn
      POSTGRES_USER: lana_user
      POSTGRES_PASSWORD: lana_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
